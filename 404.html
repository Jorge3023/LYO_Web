<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#050608">
<title>LYO — Señal perdida</title>
<script>
  // GitHub Pages distingue mayúsculas: /Terminal, /Help, /Ayuda... terminan aquí y se mandan a la subpágina real
  (function () {
    var p = location.pathname;
    var m = p.match(/^\/lyo_web\//i);
    var base = m ? p.slice(0, m[0].length) : '/';
    var resto = p.slice(base.length).replace(/\/+$/, '').toLowerCase();
    var rutas = { 'terminal': 'terminal/', 'help': 'help/', 'ayuda': 'help/' };
    var clave = resto.replace(/\/index\.html$/, '');
    if (rutas[clave]) location.replace('/LYO_Web/' + rutas[clave]);
  })();
</script>
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #050608; color: #9AA3B2; font-family: Consolas, 'Cascadia Mono', 'Lucida Console', monospace; font-size: 15px; }
  main { padding: 32px; max-width: 34em; }
  a { color: #E0EBE6; text-underline-offset: 3px; }
  p { margin: 0 0 10px; }
</style>
</head>
<body>
<main>
<p style="color:#FF9A9A">ERROR 404: señal perdida.</p>
<p>Lo que buscas no está aquí. O ya no.</p>
<p><a href="/LYO_Web/">[ volver ]</a></p>
</main>
</body>
</html>
